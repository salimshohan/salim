<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookVault | Comprehensive Catalog</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --surface-hover: #334155;
            --primary-color: #38bdf8;
            --primary-hover: #0284c7;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --radius: 12px;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        .app-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        .brand {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* Buttons */
        button {
            cursor: pointer;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-sync {
            background-color: transparent;
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
            padding: 8px 16px;
        }

        .btn-sync:hover { background-color: rgba(56, 189, 248, 0.1); }
        .btn-primary { background-color: var(--primary-color); color: #fff; padding: 12px 24px; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-success { background-color: var(--success-color); color: #fff; padding: 10px 20px; width: 100%; margin-top: 15px;}
        .btn-danger { background-color: transparent; color: var(--danger-color); border: 1px solid var(--danger-color); padding: 6px 12px; font-size: 0.85rem;}
        .btn-danger:hover { background-color: rgba(239, 68, 68, 0.1); }

        /* Dashboard & Cards */
        .card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 25px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        input {
            flex: 1;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }

        input:focus { border-color: var(--primary-color); }

        /* Preview Area */
        .preview-area {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px dashed var(--border-color);
        }

        .preview-content {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        .preview-content img, .book-header img {
            width: 100px;
            height: 150px;
            object-fit: cover;
            border-radius: 6px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
        }

        .preview-details h4 { margin: 0 0 5px 0; font-size: 1.2rem; color: var(--primary-color); }
        .text-muted { color: var(--text-muted); font-size: 0.95rem; margin: 4px 0; }
        .text-sm { color: var(--text-muted); font-size: 0.85rem; margin: 2px 0; }
        
        .meta-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
            background: var(--bg-color);
            padding: 10px;
            border-radius: 6px;
        }

        /* Subjects Tags */
        .subjects-container {
            margin-top: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .subject-tag {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
        }

        /* Grid */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 40px 0 20px 0;
        }

        .badge {
            background-color: var(--surface-color);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            border: 1px solid var(--border-color);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            padding-bottom: 50px;
        }

        .book-card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 20px;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease;
        }

        .book-card:hover {
            transform: translateY(-2px);
            border-color: var(--primary-color);
        }

        .book-header {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .book-info h4 { margin: 0 0 5px 0; font-size: 1.1rem; color: var(--text-main); }
        .book-info a { color: var(--primary-color); text-decoration: none; font-size: 0.85rem; }
        .book-info a:hover { text-decoration: underline; }
        
        .card-actions { margin-top: auto; display: flex; justify-content: flex-end; padding-top: 15px; border-top: 1px solid var(--border-color); }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Top Navigation -->
        <nav class="navbar">
            <div class="brand">📚 BookVault</div>
            <button id="syncBtn" class="btn-sync">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"></path><path d="M12 12v9"></path><path d="m8 17 4-4 4 4"></path></svg>
                Sync Data
            </button>
        </nav>

        <main class="dashboard">
            <!-- Add New Book Section -->
            <section class="action-panel card">
                <h3>Add to Vault</h3>
                <div class="input-group">
                    <input type="text" id="isbnInput" placeholder="Enter ISBN (e.g., 9780131103627 or 9780439708180)" autocomplete="off">
                    <button id="fetchBtn" class="btn-primary">Search</button>
                </div>

                <!-- Inline Preview (Hidden by default) -->
                <div id="previewSection" class="preview-area" style="display: none;">
                    <div class="preview-content">
                        <img id="previewCover" src="" alt="Book Cover">
                        <div class="preview-details" style="flex: 1;">
                            <h4 id="previewTitle"></h4>
                            <p id="previewAuthor" class="text-muted"></p>
                            
                            <div class="meta-grid">
                                <span id="previewPublisher" class="text-sm"></span>
                                <span id="previewDate" class="text-sm"></span>
                                <span id="previewPages" class="text-sm"></span>
                                <span id="previewIsbn" class="text-sm"></span>
                            </div>
                            
                            <div id="previewSubjects" class="subjects-container"></div>
                        </div>
                    </div>
                    <button id="saveBtn" class="btn-success">Confirm & Save</button>
                </div>
            </section>

            <!-- Catalog Grid -->
            <section class="catalog-section">
                <div class="section-header">
                    <h3>My Collection</h3>
                    <span id="bookCount" class="badge">0 Books</span>
                </div>
                <div id="catalogGrid" class="grid">
                    <!-- Cards injected via JS -->
                </div>
            </section>
        </main>
    </div>

    <script>
        // State variables
        let currentBookPreview = null;
        let catalog = JSON.parse(localStorage.getItem('vaultBookCatalog')) || [];

        // DOM Elements
        const isbnInput = document.getElementById('isbnInput');
        const fetchBtn = document.getElementById('fetchBtn');
        const previewSection = document.getElementById('previewSection');
        const saveBtn = document.getElementById('saveBtn');
        const catalogGrid = document.getElementById('catalogGrid');
        const bookCount = document.getElementById('bookCount');
        const syncBtn = document.getElementById('syncBtn');

        // Helper: Limit subjects array
        const getSubjectsHtml = (subjects) => {
            if (!subjects || subjects.length === 0) return '';
            return subjects.slice(0, 4).map(sub => `<span class="subject-tag">${sub.name}</span>`).join('');
        };

        // 1. Fetch comprehensive metadata
        fetchBtn.addEventListener('click', async () => {
            const isbn = isbnInput.value.trim().replace(/-/g, ''); // Remove dashes if any
            if (!isbn) return;

            try {
                fetchBtn.innerText = "Searching...";
                const response = await fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&format=json&jscmd=data`);
                const data = await response.json();
                
                const bookKey = `ISBN:${isbn}`;
                if (data[bookKey]) {
                    const bookInfo = data[bookKey];
                    
                    // Extract all available information with fallbacks
                    currentBookPreview = {
                        id: Date.now().toString(),
                        isbn: isbn,
                        title: bookInfo.title || "Unknown Title",
                        subtitle: bookInfo.subtitle ? `: ${bookInfo.subtitle}` : "",
                        author: bookInfo.authors ? bookInfo.authors.map(a => a.name).join(', ') : "Unknown Author",
                        publisher: bookInfo.publishers ? bookInfo.publishers.map(p => p.name).join(', ') : "Unknown Publisher",
                        publishDate: bookInfo.publish_date || "Unknown Date",
                        pages: bookInfo.number_of_pages ? `${bookInfo.number_of_pages} pages` : "Pages unknown",
                        subjectsHtml: getSubjectsHtml(bookInfo.subjects),
                        url: bookInfo.url || "#",
                        // Fallback image generated via Placeholder API if no cover is found
                        cover: bookInfo.cover ? bookInfo.cover.medium : "https://via.placeholder.com/150x225/1e293b/94a3b8?text=No+Cover+Available"
                    };

                    displayPreview();
                } else {
                    resetPreview();
                    isbnInput.value = "Not found. Try another ISBN.";
                    setTimeout(() => isbnInput.value = "", 2000);
                }
            } catch (error) {
                console.error("API Error:", error);
                alert("Network error occurred.");
            } finally {
                fetchBtn.innerText = "Search";
            }
        });

        // 2. Display the inline preview with extra data
        function displayPreview() {
            document.getElementById('previewCover').src = currentBookPreview.cover;
            document.getElementById('previewTitle').innerText = currentBookPreview.title + currentBookPreview.subtitle;
            document.getElementById('previewAuthor').innerHTML = `<strong>Author:</strong> ${currentBookPreview.author}`;
            
            document.getElementById('previewPublisher').innerHTML = `🏢 ${currentBookPreview.publisher}`;
            document.getElementById('previewDate').innerHTML = `📅 ${currentBookPreview.publishDate}`;
            document.getElementById('previewPages').innerHTML = `📑 ${currentBookPreview.pages}`;
            document.getElementById('previewIsbn').innerHTML = `🏷️ ISBN: ${currentBookPreview.isbn}`;
            
            document.getElementById('previewSubjects').innerHTML = currentBookPreview.subjectsHtml;
            
            previewSection.style.display = 'block';
        }

        function resetPreview() {
            currentBookPreview = null;
            previewSection.style.display = 'none';
            isbnInput.value = '';
        }

        // 3. Save to localStorage
        saveBtn.addEventListener('click', () => {
            if (currentBookPreview) {
                const exists = catalog.find(b => b.isbn === currentBookPreview.isbn);
                if (exists) {
                    saveBtn.innerText = "Already in Vault!";
                    setTimeout(() => saveBtn.innerText = "Confirm & Save", 2000);
                    return;
                }

                catalog.push(currentBookPreview);
                localStorage.setItem('vaultBookCatalog', JSON.stringify(catalog));
                
                resetPreview();
                renderCatalog();
            }
        });

        // 4. Render the saved catalog with extra data
        function renderCatalog() {
            catalogGrid.innerHTML = '';
            bookCount.innerText = `${catalog.length} Book${catalog.length !== 1 ? 's' : ''}`;
            
            catalog.forEach(book => {
                const card = document.createElement('div');
                card.className = 'book-card';
                card.innerHTML = `
                    <div class="book-header">
                        <img src="${book.cover}" alt="Cover">
                        <div class="book-info">
                            <h4>${book.title}</h4>
                            <p class="text-muted" style="margin-bottom: 8px;">${book.author}</p>
                            <p class="text-sm">🏢 ${book.publisher}</p>
                            <p class="text-sm">📅 ${book.publishDate} | 📑 ${book.pages}</p>
                            <div class="subjects-container" style="margin-bottom: 8px;">
                                ${book.subjectsHtml}
                            </div>
                            ${book.url !== "#" ? `<a href="${book.url}" target="_blank">View on Open Library ↗</a>` : ''}
                        </div>
                    </div>
                    <div class="card-actions">
                        <button onclick="deleteBook('${book.id}')" class="btn-danger">Delete</button>
                    </div>
                `;
                catalogGrid.appendChild(card);
            });
        }

        // 5. Delete a book
        window.deleteBook = function(id) {
            catalog = catalog.filter(book => book.id !== id);
            localStorage.setItem('vaultBookCatalog', JSON.stringify(catalog));
            renderCatalog();
        }

        // 6. Sync Logic (Attach your Drive API logic here)
        syncBtn.addEventListener('click', () => {
            syncBtn.innerHTML = "Syncing...";
            // Insert your Google Drive appDataFolder sync logic here
            setTimeout(() => {
                syncBtn.innerHTML = `
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
                    Synced
                `;
                setTimeout(() => {
                    syncBtn.innerHTML = `
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"></path><path d="M12 12v9"></path><path d="m8 17 4-4 4 4"></path></svg>
                        Sync Data
                    `;
                }, 2000);
            }, 1000);
        });

        // Initialize
        renderCatalog();
    </script>
</body>
</html>
